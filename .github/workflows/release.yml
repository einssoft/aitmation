# Release bundles: a tag v* builds one archive per target platform with the
# launcher, its own Python including all packages, uv, the core sources, the
# base solutions and the built interface (scripts/bundle.sh) and attaches it
# to a GitHub release. The first start needs no network. Intel Macs are not
# built (no wheels for cryptography/onnxruntime). Signing is still open
# (SHA-256 sums are included).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v), e.g. 0.1.0
        required: true

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  bundle:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT";
          else echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - run: scripts/bundle.sh "${{ steps.v.outputs.version }}" ${{ matrix.target.goos }} ${{ matrix.target.goarch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/*

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
