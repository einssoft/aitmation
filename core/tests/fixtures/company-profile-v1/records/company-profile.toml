required = true
group = "address"
pattern = "\\d{5}"
example = "80331"
label = { de = "Postleitzahl", fr = "Code postal", it = "Codice postale", en = "Postal code" }

[variants.DE.iban]
type = "text"
group = "bank"
pattern = "DE\\d{2}(?: ?\\d{4}){4} ?\\d{2}"
example = "DE89 3704 0044 0532 0130 00"
label = { de = "IBAN", fr = "IBAN", it = "IBAN", en = "IBAN" }

