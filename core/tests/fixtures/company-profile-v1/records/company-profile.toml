  { value = "DE-HB", label = { de = "Bremen", fr = "Brême", it = "Brema", en = "Bremen" } },
  { value = "DE-HH", label = { de = "Hamburg", fr = "Hambourg", it = "Amburgo", en = "Hamburg" } },
  { value = "DE-HE", label = { de = "Hessen", fr = "Hesse", it = "Assia", en = "Hesse" } },
  { value = "DE-MV", label = { de = "Mecklenburg-Vorpommern", fr = "Mecklembourg-Poméranie-Occidentale", it = "Meclemburgo-Pomerania Anteriore", en = "Mecklenburg-Western Pomerania" } },
  { value = "DE-NI", label = { de = "Niedersachsen", fr = "Basse-Saxe", it = "Bassa Sassonia", en = "Lower Saxony" } },
