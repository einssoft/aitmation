label = { de = "USt-IdNr.", fr = "Numéro d'identification TVA", it = "Partita IVA (USt-IdNr.)", en = "VAT ID (USt-IdNr.)" }
help = { de = "Umsatzsteuer-Identifikationsnummer (Regelsatz 19 %, ermässigt 7 %).", fr = "Numéro d'identification TVA (taux normal 19 %, réduit 7 %).", it = "Numero di identificazione IVA (aliquota ordinaria 19 %, ridotta 7 %).", en = "VAT identification number (standard rate 19%, reduced 7%)." }

[variants.DE.state]
